# ============================================================
# automation-backend — local/self-hosted stack (app + redis)
# Usage:
#   cp .env.example .env   # edit values
#   docker compose up -d --build
#   docker compose logs -f app
# ============================================================

services:
  redis:
    image: redis:7-alpine
    container_name: automation-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Not exposed to host by default (only reachable inside the compose network).
    # Uncomment to access Redis from the host:
    # ports:
    #   - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: automation-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override REDIS_URL to point at the compose service (wins over .env value).
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      NODE_ENV: production
      # The address the Extension should connect to, shown beside the
      # Authorization Code. Set it in .env (PUBLIC_DOMAIN=https://your-domain).
      #
      # Written as an interpolation, NOT a literal, and that distinction matters:
      # `environment:` wins over `env_file:`, so hardcoding a blank value here
      # would silently erase whatever the operator put in .env -- the one place
      # they were told to configure it. `${PUBLIC_DOMAIN:-}` instead resolves
      # from .env (Compose reads it for substitution) or the shell, and falls
      # back to empty so the stack still starts when it is unset.
      #
      # Worth setting for Docker specifically: from inside a container the only
      # detectable addresses are the bridge IP and the container hostname, and
      # neither is reachable from the operator's browser.
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:-}"
      # See the Dockerfile for the full reasoning. Short version: the
      # `production` profile is headless, and a headless Chrome loads ZERO
      # extensions — so NODE_ENV=production alone silently shipped a Remote
      # Browser with no Element Inspector. `server` is headed on a virtual
      # display and is what a deployed server almost always means.
      APP_ENV: server
    ports:
      - "3000:3000"
    # Chrome needs more than the default 64MB of shared memory. Without this the
    # browser dies mid-page with "Target closed" / SIGBUS on heavy sites, which
    # reads like an application bug and is not one.
    shm_size: "1gb"
    volumes:
      # Persist runtime data across container restarts
      - ./logs:/app/logs
      - ./profiles:/app/profiles
      - ./uploads:/app/uploads
      - ./downloads:/app/downloads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.PORT||3000)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

volumes:
  redis-data:
