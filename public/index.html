<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Aria Automate</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-lang="en">

  <!-- ============================================ -->
  <!-- LOGIN SCREEN                                  -->
  <!-- ============================================ -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo" data-icon="zap" data-icon-size="30"></div>
      <h1 class="login-title" data-i18n="app.title">Aria Automate</h1>
      <p class="login-subtitle" data-i18n="login.subtitle">Enter your API key to sign in</p>

      <form id="login-form" autocomplete="off">
        <label class="field">
          <span class="field-label" data-i18n="login.apiKey">API Key</span>
          <div class="field-input-wrap">
            <input
              type="password"
              id="api-key-input"
              class="field-input"
              placeholder="••••••••••••••••"
              autocomplete="off"
              spellcheck="false"
              required
            />
            <button type="button" id="toggle-key" class="icon-btn" aria-label="toggle" data-icon="eye"></button>
          </div>
        </label>

        <label class="field checkbox-field">
          <input type="checkbox" id="remember-key" checked />
          <span data-i18n="login.remember">Remember me</span>
        </label>

        <div id="login-error" class="login-error" hidden></div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-block">
          <span data-i18n="login.submit">Sign in</span>
        </button>
      </form>

      <div class="login-footer">
        <button type="button" class="link-btn" id="lang-toggle-login" hidden>English</button>
      </div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- DASHBOARD APP SHELL                           -->
  <!-- ============================================ -->
  <div id="app" class="app" hidden>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <!-- EXACTLY six entries — the locked information architecture
           (docs/uiux/workspace-overview.md § 3A). `Live View`, `Live Browser`,
           `Schedules` and `Active Flow` are NOT places in the product: they are
           capabilities of one workflow and are reachable from a workflow row or
           from the editor. Do not re-add them here. -->
      <!-- Focused rail (docs/uiux/new ui.md §4), top to bottom:
             + New workflow · Home · Workspace · Executions … Settings (bottom).
           `Dashboard` and `Admin` stay reachable as routes (Home links to the
           dashboard; Settings to the admin panel) but are not rail entries. -->
      <nav class="sidebar-nav">
        <button type="button" class="nav-item nav-new" id="nav-new-workflow" title="New workflow" aria-label="New workflow">
          <span class="nav-icon" data-icon="plus" data-icon-size="18"></span>
          <span class="nav-label" data-i18n="nav.newWorkflow">New workflow</span>
        </button>
        <span class="nav-sep" aria-hidden="true"></span>
        <a href="#/home" class="nav-item" data-route="home">
          <span class="nav-icon" data-icon="home"></span>
          <span class="nav-label" data-i18n="nav.home">Home</span>
        </a>
        <a href="#/workspace" class="nav-item" data-route="workspace">
          <span class="nav-icon" data-icon="grid"></span>
          <span class="nav-label" data-i18n="nav.workspace">Workspace</span>
        </a>
        <a href="#/settings" class="nav-item nav-bottom" data-route="settings">
          <span class="nav-icon" data-icon="settings"></span>
          <span class="nav-label" data-i18n="nav.settings">Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sys-indicator" id="sys-indicator">
          <span class="dot" id="sys-dot"></span>
          <span id="sys-text" data-i18n="status.checking">Checking…</span>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <!-- Brand: top-left of the full-width top bar (moved from the rail). -->
        <div class="sidebar-brand topbar-brand">
          <!-- G13: the product brand mark. `zap` was a stand-in and read as the
               `Triggers` category glyph, which the palette also uses. -->
          <span class="brand-logo" data-icon="aria-mark" data-icon-size="20"></span>
          <span class="brand-text" data-i18n="app.title">Aria Automate</span>
        </div>
        <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="menu" data-icon="panel-left"></button>

        <!-- App Launcher (docs/uiux/shell-editor-launcher-menu.md § 2).
             The header carries NO nav links: the same six product areas live
             behind this one 2x2-grid button, so the chrome never grows with
             the feature set. The panel is app-level (shell), because the
             editor screen uses the identical component. -->
        <div class="launcher" id="launcher">
          <button
            class="launcher-btn"
            id="launcher-btn"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="launcher-menu"
            aria-label="Open app launcher"
            title="Apps"
            data-icon="grid"
            data-icon-size="18"
          ></button>
          <div class="launcher-menu" id="launcher-menu" role="menu" aria-label="Product areas" hidden>
            <!-- Icon sizes are pinned to 20px and the glyphs are the ones the
                 locked panel shows (grid / briefcase / shield-check), NOT the
                 16px defaults: the launcher rows are 40px tall there, so a 16px
                 glyph next to a 14px label reads as a different component.
                 Each route uses the SAME glyph as its sidebar entry. -->
            <button class="launcher-item" type="button" role="menuitem" data-route="home">
              <span class="launcher-item-icon" data-icon="home" data-icon-size="20"></span>
              <span data-i18n="nav.home">Home</span>
            </button>
            <button class="launcher-item" type="button" role="menuitem" data-route="workspace">
              <span class="launcher-item-icon" data-icon="grid" data-icon-size="20"></span>
              <span data-i18n="nav.workspace">Workspace</span>
            </button>
            <button class="launcher-item" type="button" role="menuitem" data-route="dashboard">
              <span class="launcher-item-icon" data-icon="bar-chart" data-icon-size="20"></span>
              <span data-i18n="nav.dashboard">Dashboard</span>
            </button>
            <button class="launcher-item" type="button" role="menuitem" data-route="admin">
              <span class="launcher-item-icon" data-icon="shield-check" data-icon-size="20"></span>
              <span data-i18n="nav.admin">Admin</span>
            </button>
            <button class="launcher-item" type="button" role="menuitem" data-route="settings">
              <span class="launcher-item-icon" data-icon="settings" data-icon-size="20"></span>
              <span data-i18n="nav.settings">Settings</span>
            </button>
          </div>
        </div>

        <h2 class="page-title" id="page-title" data-i18n="nav.workspace">Workspace</h2>
        <div class="topbar-actions">
          <!-- Dual Browser Mode switch (Remote / Local).
               Lives in the SHELL header, not in the editor: the mode decides
               which browser runs this user's automation everywhere -- editor,
               jobs, live view -- so a control docked inside one screen would
               imply a scope it does not have. It is a popover rather than a
               plain toggle because switching can be REFUSED (local mode off on
               the server, or no agent connected), and a refusal needs room for a
               reason plus the command that fixes it. -->
          <div class="bmode" id="bmode">
            <button
              class="bmode-btn"
              id="bmode-btn"
              type="button"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="bmode-menu"
              title="Browser mode"
            >
              <span class="bmode-dot" id="bmode-dot"></span>
              <span class="bmode-label" id="bmode-label">—</span>
            </button>
            <div class="bmode-menu" id="bmode-menu" role="dialog" aria-label="Browser mode" hidden>
              <div class="bmode-title" data-i18n="mode.title">Browser mode</div>
              <!-- Radios, matching the spec's "○ Remote Browser / ○ Local
                   Browser". Rendered by app.js from the server's own registry,
                   so a mode the server does not offer cannot appear here. -->
              <div class="bmode-opts" id="bmode-opts" role="radiogroup" aria-label="Browser mode"></div>
              <div class="bmode-note" id="bmode-note" hidden></div>
              <div class="bmode-agent" id="bmode-agent" hidden></div>
            </div>
          </div>
          <button class="icon-btn" id="lang-toggle" title="Language" data-icon="globe" hidden></button>
          <button class="icon-btn" id="theme-toggle" title="Theme" data-icon="sparkles" hidden></button>
          <button class="btn btn-ghost btn-sm" id="logout-btn" data-i18n="nav.logout">Logout</button>
        </div>
      </header>

      <main class="content" id="content">
        <!-- views are rendered here by app.js -->
      </main>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- icons.js must load first: it is the inline-SVG icon registry every other
       module (actions catalog, editor shell, panels) draws its glyphs from.
       It replaces the old emoji glyphs, which rendered as empty boxes wherever
       the platform font stack has no emoji coverage. -->
  <script src="/js/icons.js"></script>
  <script src="/js/actions.js"></script>
  <script src="/js/browser-options.js"></script>
  <script src="/js/templates.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/expression.js"></script>
  <script src="/js/graph-serialize.js"></script>
  <!-- NDV design base: pure model -> reusable Aria primitives -> per-node designs.
       Must load BEFORE flow-editor.js, which delegates to them. -->
  <script src="/js/ndv-model.js"></script>
  <script src="/js/ndv-ui.js"></script>
  <script src="/js/ndv-nodes.js"></script>
  <script src="/js/browser-options-ui.js"></script>
  <script src="/js/flow-editor.js"></script>
  <script src="/js/live.js"></script>
  <script src="/js/run-state.js"></script>
  <script src="/js/run-panel.js"></script>
  <!-- Test Workflow's live-tab decision logic (window.LiveTab). views.js calls
       LiveTab.launch() inside the click handler, so it must load before views.js;
       it was missing here, which made every Test Workflow click throw. -->
  <script src="/js/live-tab.js"></script>
  <script src="/js/real-chrome.js"></script>
  <!-- The Workflow File Manager. Must precede remote-io.js, whose file prompt
       offers "Choose from Workflow Files" only when window.WorkflowFiles exists. -->
  <script src="/js/workflow-files.js"></script>
  <!-- Must precede browser-view.js: both of its surfaces attach RemoteIO. -->
  <script src="/js/remote-io.js"></script>
  <!-- Remote ⇄ Local session handoff. Must precede browser-view.js, which reads
       window.BrowserHandoff when it draws the switch button in the picker bar. -->
  <script src="/js/browser-handoff.js"></script>
  <script src="/js/browser-view.js"></script>
  <!-- Element Inspector receiver. Must load AFTER flow-editor.js: it delivers
       picked elements through FlowEditor.applyInspectorFields(). It only starts
       listening once app.js has a valid key (see showApp), because both the
       socket and the inbox are authenticated. -->
  <script src="/js/inspector-client.js"></script>
  <!-- The LOCAL / REMOTE chooser the crosshair now opens first. Must load AFTER
       inspector-client.js (it calls InspectorClient.targeting*) and AFTER
       browser-view.js (the remote branch hands the popup tab to
       BrowserView.openRealBrowser). -->
  <script src="/js/targeting-flow.js"></script>
  <!-- Native workflow file (export/import). Must precede views.js. -->
  <script src="/js/workflow-exchange.js"></script>
  <script src="/js/settings-ui.js"></script>
  <script src="/js/views.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
