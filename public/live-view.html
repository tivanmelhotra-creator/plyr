<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="referrer" content="no-referrer" />
  <title>Live run view</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="live-view-body">
  <main class="live-view-wrap" id="lv-root">
    <header class="live-view-header">
      <div class="live-view-title">
        <span class="live-view-logo" id="lv-logo" aria-hidden="true"></span>
        <div>
          <h1 id="lv-title">Live run view</h1>
          <p class="live-view-sub" id="lv-meta"></p>
        </div>
      </div>
      <div class="live-view-status" role="status" aria-live="polite">
        <span id="lv-status-dot" class="lv-dot lv-dot-connecting"></span>
        <span id="lv-status-text"></span>
      </div>
    </header>

    <div class="lv-layout">
      <nav class="lv-timeline" aria-label="Steps">
        <h2 class="lv-h" id="lv-steps-title">Steps</h2>
        <ol class="lv-steps" id="lv-steps"></ol>
      </nav>

      <section class="lv-main">
        <figure class="lv-browser" id="lv-browser">
          <img id="lv-frame" class="lv-frame" alt="" hidden />
          <figcaption class="lv-browser-msg" id="lv-browser-msg"></figcaption>
        </figure>

        <section class="lv-output" aria-live="polite">
          <h2 class="lv-h" id="lv-output-title">Output</h2>
          <div class="lv-output-head" id="lv-output-head"></div>
          <pre class="lv-sample" id="lv-output" tabindex="0"></pre>
          <div class="lv-step-err" id="lv-output-err" hidden></div>
        </section>
      </section>
    </div>

    <footer class="live-view-footer">
      <span id="lv-error" class="lv-error" hidden></span>
      <span class="lv-readonly" id="lv-readonly"></span>
    </footer>
  </main>

  <script src="/js/icons.js"></script>
  <script src="/js/run-state.js"></script>
  <script src="/js/live-tab.js"></script>
  <script src="/js/live-view.js"></script>
</body>
</html>
