# Disposable, loopback-only development stack. Never use this file for production.
# ./plyr dev-docker owns only the "plyr-dev" Compose project and deletes its volumes.
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: plyr-dev:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # `./plyr dev-docker` asks "development (no login) or production-like
      # (password)" and passes the answer through --env-file
      # .plyr/dev-docker.env. NO credential is generated or printed:
      #   development      -> APP_ENV=development: the panel opens with no login
      #                       and no token (published on 127.0.0.1 only).
      #   production-like  -> APP_ENV=production: the first page you open asks you
      #                       to choose a password, then a normal login follows.
      # A bare `docker compose -f docker-compose.dev.yml up` behaves as development.
      APP_ENV: ${PLYR_DEV_APP_ENV:-development}
      DEPLOYMENT_MODE: single
      # Inside the container the browser reaches the app through Docker's bridge,
      # not loopback, so keyless development access must accept that peer. Allowed
      # ONLY here: this stack is disposable and published on 127.0.0.1 alone.
      ALLOW_OPEN_AUTH: "true"
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      PUBLIC_DOMAIN: http://localhost:3000
      WORKFLOW_STORAGE_ROOT: /app/workflow-files
      SQLITE_PATH: /app/data/plyr.db
    ports:
      - "127.0.0.1:3000:3000"
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
