# Disposable, loopback-only development stack. Never use this file for production.
# ./plyr dev-docker owns only the "plyr-dev" Compose project and deletes its volumes.
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: plyr-dev:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: server
      DEPLOYMENT_MODE: single
      # `./plyr dev-docker` asks "development (no login) or production-like
      # (real token)" and passes the answer through --env-file
      # .plyr/dev-docker.env. Both modes get a random token; the fallbacks below
      # only apply to a bare `docker compose -f docker-compose.dev.yml up`.
      API_TOKEN: ${PLYR_DEV_API_TOKEN:-admin123}
      AUTH_MODE: ${PLYR_DEV_AUTH_MODE:-open}
      # Open login is otherwise refused under APP_ENV=server. Allowed here only
      # because this stack is disposable and published on 127.0.0.1 alone.
      ALLOW_OPEN_AUTH: "true"
      # The ONLY place the public default token is acceptable under APP_ENV=server
      # (the bare-compose fallback above). Anywhere else the server refuses to
      # start with admin123 (see src/core/StartupValidation.ts).
      ALLOW_DEFAULT_API_TOKEN: "true"
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      PUBLIC_DOMAIN: http://localhost:3000
      WORKFLOW_STORAGE_ROOT: /app/workflow-files
      SQLITE_PATH: /app/data/plyr.db
    ports:
      - "127.0.0.1:3000:3000"
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
