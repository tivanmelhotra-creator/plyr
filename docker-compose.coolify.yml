# ============================================================
# automation-backend — Coolify deployment stack (app + redis)
# ------------------------------------------------------------
# Use this file when deploying via Coolify (https://coolify.io).
#
# Why a separate file?
#   - Coolify provisions an isolated project/network per app and
#     handles the public domain, TLS and reverse-proxy itself
#     (via Traefik). So we DON'T publish ports to the host and we
#     DON'T bundle Caddy here — Coolify's proxy does that.
#   - The app listens on PORT 3000 internally; in Coolify set the
#     service "Port" (exposed port) to 3000 and attach your domain.
#
# How to deploy on Coolify:
#   1. Coolify → New Resource → Docker Compose (or "Public/Private Git").
#   2. Point it at this repository; set the compose file to
#        docker-compose.coolify.yml
#   3. Set the exposed port to 3000 and attach your domain
#      (Coolify will request a Let's Encrypt certificate automatically).
#   4. Add environment variables (Coolify UI → Environment Variables):
#        DEPLOYMENT_MODE=single
#        API_TOKEN=tok_xxxxxxxx...   (or leave empty -> auto-generated at boot)
#        NODE_ENV=production
#        APP_ENV=server            (headed browser -> extensions load)
#        PUBLIC_DOMAIN=https://your-domain   <-- the domain you attached in 3.
#      REDIS_URL is set below to the internal redis service.
#
#      PUBLIC_DOMAIN matters more here than anywhere else, and it is the ONE
#      name to use for it. Coolify terminates your domain at its own proxy, so
#      the container cannot see it: without this the panel has nothing to show
#      beside the Authorization Code except an address on the internal docker
#      network, which the Extension can never reach. Do not set BASE_URL as
#      well — it is accepted only as a synonym when reading, and setting both
#      is the duplicate configuration this project exists to avoid.
#   5. Deploy. Open https://your-domain/ and log in with the API_TOKEN.
#
# Cloudflare note (if your domain is on Cloudflare):
#   Create an A record -> server IP and set it to "DNS only"
#   (grey cloud, proxy OFF) so Coolify/Traefik can issue the cert.
# ============================================================

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Internal redis service (same compose network).
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      NODE_ENV: production
      # The profile that decides whether the Remote Browser actually works.
      #
      # `production` is HEADLESS, and a headless Chrome loads ZERO extensions
      # (measured: 0 service workers headless vs 1 headed), so it silently
      # ships without the Element Inspector or any cookie extension. `server`
      # keeps the same hardening but runs headed on a virtual display.
      # Override to `production` only if this instance runs the job queue and
      # nothing else.
      APP_ENV: ${APP_ENV:-server}
      # --- Set these in the Coolify Environment Variables UI ---
      # Defaults provided here so the stack boots even before you
      # customise them; override in Coolify for production.
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-single}
      API_TOKEN: ${API_TOKEN:-}
      # The address the Extension must connect to, shown beside the
      # Authorization Code when pairing a Local Browser.
      #
      # WHY THIS LINE HAD TO BE ADDED. It was missing, and Coolify is the one
      # deployment where its absence is guaranteed to hurt. Coolify terminates
      # the public domain at Traefik and forwards to this container on an
      # internal network, so from in here the only detectable addresses are the
      # compose bridge IP and the container hostname — and NEITHER is reachable
      # from the operator's browser. Without this the panel could only fall back
      # to a detected address, which is exactly the "first system IP guessed as
      # the Public URL behind Cloudflare / reverse proxy / Coolify / NAT" that
      # this stack must never do.
      #
      # `${PUBLIC_DOMAIN:-}` is an interpolation, not a literal, and that
      # distinction is load-bearing: Compose's `environment:` overrides
      # `env_file:` and the Coolify UI's own variables, so a hardcoded blank
      # would ERASE the value the operator was told to set. Resolving to empty
      # instead leaves the server's detection path untouched.
      #
      # ONE NAME ON PURPOSE. PUBLIC_DOMAIN is the single source of truth;
      # BASE_URL is only accepted as a read-time synonym by src/config.ts and is
      # deliberately not plumbed here, so no deployment path can set one name
      # while another path reads the other.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
    # Coolify maps the public domain to this internal port via its proxy.
    # The magic label below tells Coolify which container port to expose.
    expose:
      - "3000"
    # Chrome needs more than Docker's default 64MB /dev/shm. Without this the
    # browser dies mid-page on heavy sites with "Target closed", which reads
    # like an application bug and is not one.
    shm_size: "1gb"
    volumes:
      # Persist runtime data across redeploys.
      - app-logs:/app/logs
      - app-profiles:/app/profiles
      - app-uploads:/app/uploads
      - app-downloads:/app/downloads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.PORT||3000)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

volumes:
  redis-data:
  app-logs:
  app-profiles:
  app-uploads:
  app-downloads:
